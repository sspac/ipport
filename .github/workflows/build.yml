name: build-parts
# Builds libisaacport.so + classes.dex (+ manifest, resources, source assets) from the port source with
# the Yama layer on top, and hands them over as ONE small zip. The 1.4 GB game files are never built:
# they stay in the APK folder you already have. Run it from Actions > build-parts > Run workflow.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release = clean build, report = diagnostic build"
        type: choice
        options: [release, report]
        default: release
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK and NDK (the versions the project pins)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Apply the Yama layer
        run: bash yama/apply_yama.sh "${{ inputs.variant }}"
      - name: Build
        working-directory: port
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          if [ "${{ inputs.variant }}" = "release" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: Collect the parts
        run: |
          APK=$(ls port/app/build/outputs/apk/*/app-*.apk | head -n1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          rm -rf parts && mkdir parts
          unzip -q "$APK" -d parts
          rm -rf parts/META-INF
          # the phone's merged index.txt (source rows + Yama + Fiend Folio rows) must not be replaced
          rm -f parts/assets/port_patch/index.txt
          (cd parts && sha256sum lib/arm64-v8a/*.so classes*.dex > ../SHA256.txt)
          cp SHA256.txt parts/SHA256.txt
          (cd parts && zip -q -r ../tboi-parts-${{ inputs.variant }}.zip .)
          cat SHA256.txt; ls -lh tboi-parts-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tboi-parts-${{ inputs.variant }}
          path: tboi-parts-${{ inputs.variant }}.zip
          retention-days: 14
